[package]
name = "ctx-menu-manager"
version = "2.1.0"
description = "Windows 右键菜单管理器"
authors = ["TongenShen"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ctx_menu_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctx-menu-core = { path = "../core" }
